<html>
<head>
    <title>Viewer</title>
    <link href="viewer_main.css" rel="stylesheet" type="text/css" />
    <style id="directionStyle"></style>
</head>
<body>
    <div id="screenTest" style="width:100vw;height:100vh;visibility:hidden;z-index:-99"></div>

    <div id="navSwitch" onclick="NavSwitch()"></div>
    <div id="menu">

        <div id="navSwitchDummy" style="width:10vw;background:transparent;">TOC</div>
        <div style="border-right:solid 1px;">
            <div><input id="fontSizeInput" style="width:3em" type="number" />px</div>

        </div>
        <div><div style="cursor:pointer;" onclick="Inspector()"><span id="string_inspector">検査</span></div></div>
        <div>
            <div style="top:1.5vh;line-height:1.15em;">
                <span id="string_theme">テーマ</span>
                <select id="themeSelect" onchange="SetTheme()">
                    <option value="default" selected>Default</option>
                    <option value="warm">Warm</option>
                    <option value="dark">Dark</option>
                </select>
                <br />
                <span id="string_lang">言語</span>
                <select id="langSelect" onchange="SetUiLanguage()">
                    <option value="ja" selected>日本語</option>
                    <option value="zh-TW">繁體</option>
                    <option value="zh-CN">简体</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>
        <div><div style="cursor:pointer;" onclick="ImageQuickView()"><span id="string_viewillu">速览插图</span></div></div>
        <div><div style="cursor:pointer;" onclick="ImageAlbum()"><span id="string_album">畫冊</span></div></div>
        <div><div style="cursor:pointer;" onclick="BookInfo()"><span id="string_bookinfo">书籍信息</span></div></div>
        <div><div style="cursor:pointer;" onclick="SearchService()"><span id="string_search">搜索</span></div></div>
        <div><div style="cursor:pointer;" onclick="TogglePaged()"><span id="string_paged">滾動</span></div></div>
        <div><div style="cursor:pointer;" onclick="ToggleDualPage()"><span id="string_dual">單頁</span></div></div>
        <div id="menuOpen" style="float:right;border-right:none;border-left:solid 1px;">
            <div style="cursor:pointer;" onclick="OpenBook()"><span id="string_open">開檔</span></div>
        </div>

    </div>
    <div id="sp_frame_general_container" class="sp_frame_container"><div class="sp_frame_close" onclick="document.CloseSpFrame()">閉じる</div><iframe id="sp_frame_general" class="sp_frame"></iframe></div>
    <div id="sp_frame_search_container" class="sp_frame_container"><div class="sp_frame_close" onclick="document.CloseSpFrame()">閉じる</div><iframe id="sp_frame_search" class="sp_frame"></iframe></div>
    <div id="nav" style=""></div>
    <div id="mouseListener" style="position:fixed;z-index:1;width:100vw;height:100vh;left:0;top:0;"></div>
    <div id="scrollBar_container" onmouseenter="ScrollBarMouseEnter(event)" onmouseleave="ScrollBarMouseLeave(event)" onmousemove="ScrollBarMouseMove(event)">
        <div id="scrollBarChapterDisplay" class="scrollBarChapterDisplay"><div class="scrollBarChapterName"></div></div>
    </div>
    <div id="measure_container"><div></div><div></div></div>
    <div id="pageMask"></div>
    <div id="openMask">開いています…</div>
    <div id="context_menu"></div>
    <div id="imageZoom"><img id="imageZoomImg" alt="" /><img id="imageZoomImgR" alt="" /></div>

    <script src="viewer_settings.js"></script>
    <script src="viewer_control.js"></script>
    <script src="viewer_footnote.js"></script>
    <script src="viewer_function.js"></script>
    <script src="viewer_measure.js"></script>
    <script src="viewer_menu.js"></script>
    <script src="viewer_nav.js"></script>
    <script src="viewer_oncopy.js"></script>
    <script src="viewer_scrollbar.js"></script>
    <script src="viewer_sp_frame.js"></script>
    <script src="viewer_strings.js"></script>
    <script src="viewer_utils.js"></script>
    <script src="viewer_paged.js"></script>
    <script>
        var direction_rtl = new Object();
        direction_rtl.GetParallelLength = function (e) { return e.pendingLoad ? 0 : e.offsetWidth; }
        direction_rtl.SetParallelLength = function (e, px) { e.style.width = px + "px"; }
        direction_rtl.GetElementPos = function (e, f) { return f.contentWindow.document.documentElement.scrollWidth - e.getBoundingClientRect().right; }
        direction_rtl.GetWindowLength = function () { return window.innerWidth; }
        function ImagePixelSize(img) {
            if (!img) return null;
            let w = img.naturalWidth || 0;
            let h = img.naturalHeight || 0;
            if (img.viewBox && img.viewBox.baseVal && img.viewBox.baseVal.width) {
                w = img.viewBox.baseVal.width;
                h = img.viewBox.baseVal.height;
            }
            if ((!w || !h) && img.getAttribute) {
                let vb = img.getAttribute("viewBox") || img.getAttribute("viewbox") || "";
                let p = vb.trim().split(/[\s,]+/);
                if (p.length >= 4) { w = parseFloat(p[2]); h = parseFloat(p[3]); }
            }
            if (w > 0 && h > 0) return { w: w, h: h };
            return null;
        }
        direction_rtl.AdjustFrameSize = function (f) {
            if (IsImageOnlyPage(f.contentDocument)) {
                f.imagePage = true;
                let img = f.contentDocument.querySelector("img,svg");
                let box = ImagePixelSize(img);
                if (!box && img && img.tagName == "IMG" && !img.complete && !f.imageSizeWait) {
                    f.imageSizeWait = true;
                    img.addEventListener("load", function () {
                        if (f.discarded) return;
                        direction.AdjustFrameSize(f);
                        if (paged) {
                            if (typeof ApplyPagedFrame === "function") ApplyPagedFrame(f, false, 0, null);
                            if (typeof TryFinishSpreadJump === "function") TryFinishSpreadJump();
                        } else {
                            Scroll(0);
                            SetScrollBar();
                        }
                    });
                    return;
                }
                if (box) {
                    f.imgNatW = box.w;
                    f.imgNatH = box.h;
                    f.width = Math.ceil((f.offsetHeight || 1) * box.w / box.h) + "px";
                    return;
                }
                return;
            }
            f.style.left = "auto";
            f.style.removeProperty("width");
            var doc = f.contentWindow.document;
            var sw = Math.max(
                (doc.documentElement && doc.documentElement.scrollWidth) || 0,
                (doc.body && doc.body.scrollWidth) || 0,
                1
            );
            f.style.width = sw + "px";
            console.log(f.style.width);
        }
        direction_rtl.SetPosStyle = function (e) { e.style.right = e.pos + "px"; }
        direction_rtl.GetEventParallel = function (e) { return e.target.offsetWidth - e.x; }
        direction_rtl.GetEventParallelPercent = function (e) { return (e.target.offsetWidth - e.x) / e.target.offsetWidth; }
        direction_rtl.SetParallelPositivePos = function (e, px) { e.style.right = px + "px"; }
        direction_rtl.GetEffective = function (x, y) { return x; };
        direction_rtl.GetDelta = function (d1, d2) { return d1 - d2; };
        direction_rtl.KeyToDirection = function (k) {
            switch (k) {
                case "ArrowLeft": return -1;
                case "ArrowUp": return 1;
                case "ArrowRight": return 1;
                case "ArrowDown": return -1;
            }
            return 0;
        }
        var chromeBottomBar = "\
#scrollBar_container{width: 100vw;height:7vh; left: 0; bottom: 0; margin: 0;}\
#scrollBar{\
width: 100vw; left: 0; bottom: 0; margin: 0;margin-top:2vh;\
transform-origin: 50vw; \
}\
#scrollBar::-webkit-slider-runnable-track{height:3vh;}\
#scrollBar::-webkit-slider-thumb{width: 15px;height: 3vh;}\
.scrollBarChapterDisplay{height:3vh;margin-top:2vh;}\
.scrollBarChapterName{margin-top:-1.5em;}\
#measure_container{position:fixed;width:100%;height:1vh;left:0;bottom:6.5vh;}\
#measure_container>div{position:fixed;height:1vh;width:1vh;bottom:6vh;border-radius:0.3vh;}\
.scrollBarChapterName{box-shadow: -0.1em -0.1em 0.3em -0.1em #808080, 0.05em -0.1em 0.3em -0.1em #808080;width: auto;display: inline-block;padding-left:0 0.2em 0 0.2em;}\
";
        direction_rtl.style = "iframe{height:90vh;top:2vh;}" + chromeBottomBar.replace("transform-origin: 50vw;", "transform-origin: 50vw; transform: rotate(180deg);");
        direction_rtl.injectStyle = "body{height:100vh;min-width:66vh;writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;} img, svg {max-height:100%;max-width:66vh;}";
        direction_rtl.GetChromeLength = function () { return window.innerWidth; };
        direction_rtl.SetChromePos = function (e, px) { e.style.right = px + "px"; e.style.left = "auto"; e.style.top = "auto"; };
        direction_rtl.SetChromeLength = function (e, px) { e.style.width = px + "px"; e.style.height = ""; };
        direction_rtl.GetChromeEventPercent = function (e) { return (window.innerWidth - e.clientX) / (window.innerWidth || 1); };
        var direction_default = new Object();
        direction_default.GetParallelLength = function (e) { return e.pendingLoad ? 0 : e.offsetHeight; }
        direction_default.SetParallelLength = function (e, px) { e.style.height = px + "px"; }
        direction_default.GetElementPos = function (e, f) { return e.getBoundingClientRect().top; }
        direction_default.GetWindowLength = function () { return window.innerHeight; }
        direction_default.AdjustFrameSize = function (f) {
            if (IsImageOnlyPage(f.contentDocument)) {
                f.imagePage = true;
                let img = f.contentDocument.querySelector("img,svg");
                let box = ImagePixelSize(img);
                if (!box && img && img.tagName == "IMG" && !img.complete && !f.imageSizeWait) {
                    f.imageSizeWait = true;
                    img.addEventListener("load", function () {
                        if (f.discarded) return;
                        direction.AdjustFrameSize(f);
                        if (paged) {
                            if (typeof ApplyPagedFrame === "function") ApplyPagedFrame(f, false, 0, null);
                            if (typeof TryFinishSpreadJump === "function") TryFinishSpreadJump();
                        } else {
                            Scroll(0);
                            SetScrollBar();
                        }
                    });
                    return;
                }
                if (box) {
                    f.imgNatW = box.w;
                    f.imgNatH = box.h;
                    let w = f.offsetWidth || 1;
                    f.height = Math.ceil(w * box.h / box.w) + "px";
                    return;
                }
            }
            f.height = f.contentWindow.document.documentElement.scrollHeight + "px";
        }
        direction_default.SetPosStyle = function (e) { e.style.top = e.pos + "px"; }
        direction_default.GetEventParallel = function (e) { return e.y; }
        direction_default.GetEventParallelPercent = function (e) { return (e.y) / window.innerHeight; }//limited usage
        direction_default.SetParallelPositivePos = function (e, px) { e.style.top = px + "px"; }
        direction_default.GetEffective = function (x, y) { return y; };
        direction_default.GetDelta = function (d1, d2) { return d2 - d1; };
        direction_default.KeyToDirection = function (k) {
            switch (k) {
                case "ArrowUp": return 1;
                case "ArrowDown": return -1;
                case "ArrowLeft": return 1;
                case "ArrowRight": return -1;
            }
            return 0;
        }
        direction_default.style = "iframe{width:100vw;left:0;min-height:90vh;top:2vh;}" + chromeBottomBar;
        direction_default.injectStyle = "body{width:100vw;max-width:100vw;box-sizing:border-box;padding:0;writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;} img, svg {max-width:100%;max-height:100%;}";
        direction_default.GetChromeLength = function () { return window.innerWidth; };
        direction_default.SetChromePos = function (e, px) { e.style.left = px + "px"; e.style.right = "auto"; e.style.top = "auto"; };
        direction_default.SetChromeLength = function (e, px) { e.style.width = px + "px"; e.style.height = ""; };
        direction_default.GetChromeEventPercent = function (e) { return e.clientX / (window.innerWidth || 1); };

        ScreenTest();
        var direction = direction_default;
        var frameList = new Array();
        var urlList;
        var spreadList = [];
        var spreadGap = 16;
        var paged = true;
        document.paged = paged;
        if (typeof dualPage === "undefined") dualPage = true;
        document.dualPage = dualPage;
        //////////Load/////////
        function Init(_urlList, start = 0, posRate = 0, selector = "", _spreadList = null) {
            // Preserve OPF spread metadata when reinitializing from the scrollbar or mode toggle.
            if (_spreadList != null) spreadList = _spreadList;
            if (!spreadList) spreadList = [];
            urlList = _urlList;
            spreadMates = BuildSpreadMates();
            if (typeof RefreshScrollBarMax === "function") RefreshScrollBarMax();
            document.direction = direction;
            document.paged = paged;
            document.dualPage = dualPage;
            console.log("Init start=" + start + " pos=" + posRate + " selector=" + selector + " paged=" + paged + " dual=" + dualPage);

            directionStyle.innerHTML = direction.style;
            InitMeasure();
            if (typeof UpdatePagedLabel === "function") UpdatePagedLabel();
            if (typeof UpdateDualLabel === "function") UpdateDualLabel();

            if (paged) {
                pagedPending = { urlIndex: start, pageIndexFromRate: posRate, selector: selector || null };
            }

            let page = CreateFrame(start, posRate, CheckLoad, false, true, selector);
            frameList.push(page);
        }
        function LoadUserSettings(json) {
            document.userSettings = json;
            document.getElementById("fontSizeInput").value = json.bookFontSize;
            document.getElementById("themeSelect").value = json.viewerTheme;
            if (typeof ApplyUiLanguage === "function") ApplyUiLanguage(json.uiLanguage || "ja");
            SetTheme();
        }
        function IsImageOnlyPage(doc) {
            if (!doc || !doc.body) return false;
            let images = doc.body.querySelectorAll("img");
            let svgs = doc.body.querySelectorAll("svg");
            if (images.length + svgs.length != 1) return false;
            let text = "";
            let walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
                acceptNode: function (n) {
                    let p = n.parentElement;
                    if (!p) return NodeFilter.FILTER_REJECT;
                    let tag = (p.tagName || "").toUpperCase();
                    if (tag === "TITLE" || tag === "DESC" || tag === "SCRIPT" || tag === "STYLE" || tag === "RT") return NodeFilter.FILTER_REJECT;
                    return NodeFilter.FILTER_ACCEPT;
                }
            }, false);
            while (walker.nextNode()) text += walker.currentNode.data;
            return text.replace(/\s+/g, "") === "";
        }
        ///↓Core Function///
        function CreateFrame(urlIndex, pos, check = null, addSelfLength = false, isPosRate = false, selector = null) {
            loading++;
            console.log("Create Frame " + urlList[urlIndex] + (isPosRate ? " posRate:" : " pos:") + pos + " addSelf:" + addSelfLength + " selector=" + selector);
            let page = document.createElement("iframe");
            //private use
            page.pos = pos;
            page.urlIndex = urlIndex;
            page.spread = (spreadList && spreadList[urlIndex]) || "";
            page.pendingLoad = true;
            page.imagePage = !!(document.bookFixedLayout || (page.spread && page.spread.indexOf("pre-paginated") >= 0));
            page.style.visibility = "hidden";
            if (urlIndex == 0) page.firstFrame = true; else page.firstFrame = false;
            if (urlIndex == urlList.length - 1) page.lastFrame = true; else page.lastFrame = false;

            page.scrolling = "no";
            page.frameBorder = "0";
            page.src = urlList[urlIndex] + "?page&g=" + (document.bookGen || 0);
            direction.SetPosStyle(page);
            page.onload = function () {
                if (page.discarded) return;
                try {
                    direction.AdjustFrameSize(page);
                    if (IsImageOnlyPage(page.contentDocument) || document.bookFixedLayout || (page.spread && page.spread.indexOf("pre-paginated") >= 0)) page.imagePage = true;
                    // Image-only reflowable pages are not known when Init builds the mate table.
                    // Rebuild it after each frame reveals its actual page kind.
                    if (typeof BuildSpreadMates === "function") spreadMates = BuildSpreadMates();
                    if (typeof RefreshScrollBarMax === "function") RefreshScrollBarMax();
                    let bodyComputedStyle = page.contentWindow.getComputedStyle(page.contentDocument.body, null);
                    let wm = bodyComputedStyle.getPropertyValue("writing-mode");
                    if (direction == direction_rtl && wm != "vertical-rl") {
                        if (page.offsetHeight < page.contentDocument.documentElement.scrollHeight) {
                            console.log("Need Pagebreak");
                            //PageBreak_Rtl(page, page.contentDocument.documentElement.scrollHeight);
                        }

                    }
                    if (!paged) {
                        let measured = direction == direction_rtl ? page.offsetWidth : page.offsetHeight;
                        if (addSelfLength) {
                            page.pos = pos - measured;
                            direction.SetPosStyle(page);
                        } else {
                            if (isPosRate) {
                                page.pos = -parseInt(pos * measured);
                            } else {
                                page.pos = pos;
                            }
                            direction.SetPosStyle(page);
                        }
                        if (selector) {
                            let t = page.contentDocument.querySelector(selector);
                            if (t) {
                                let ele_pos = direction.GetElementPos(t, page);
                                page.pos = -ele_pos + 10;
                                direction.SetPosStyle(page);
                            } else console.log('Query Failure:' + selector);
                        }
                    }
                } catch (err) {
                    console.log(err);
                }
                if (page.discarded) return;
                FinishLoad(page);
                try {
                    if (paged) {
                        OnPagedFrameLoaded(page, isPosRate, pos, selector);
                        if (check != null) check();
                    } else {
                        page.style.visibility = "visible";
                        if (check != null) check();
                        if (page.discarded) return;
                        if (page.lastFrame) {
                            Scroll(-1);
                        } else { Scroll(0); }
                        SetScrollBar();
                    }
                } catch (err) {
                    console.log(err);
                }
                page.onload = null;
            }
            document.body.appendChild(page);
            return page;
        }
        function PageBreak_Rtl(frame, totelHeight) {
            let body = frame.contentDocument.body;
            let h = frame.offsetHeight;
            let w = frame.offsetWidth;
            frame.style.width = Math.ceil(totelHeight / h) * w + "px";
            let style = frame.contentDocument.createElement("style");
            style.innerHTML = "body>*{writing-mode:vertical-rl}";
            frame.contentDocument.head.appendChild(style);
        }
        var currentFrame = null;
        function GetBookPos() {
            if (currentFrame == null) return "/0";
            if (paged && currentFrame.pages && currentFrame.pages.length) {
                return "/" + currentFrame.urlIndex + "/" + (-currentFrame.pageIndex) + "/" + currentFrame.pages.length;
            }
            return "/" + currentFrame.urlIndex + "/" + Math.floor(currentFrame.pos) + "/" + (direction.GetParallelLength(currentFrame));
        }
        document.Scroll = Scroll;
        function Scroll(px) {
            if (paged) {
                if (!px) return;
                TurnPage(px > 0 ? 1 : -1);
                return;
            }
            if (!frameList.length) return;
            if (frameList[0].firstFrame && px > 0) {
                if (frameList[0].pos + px > 0) { px = - frameList[0].pos; }
            }
            let last = frameList[frameList.length - 1];
            if (last.lastFrame && !last.pendingLoad && px < 0) {
                if (last.pos + direction.GetParallelLength(last) + px < direction.GetWindowLength()) { px = direction.GetWindowLength() - last.pos - direction.GetParallelLength(last); }
            }
            if (px > 0) {
                let top = null;
                for (let i = 0; i < frameList.length; i++) {
                    if (!frameList[i].pendingLoad) { top = frameList[i]; break; }
                }
                if (top && !top.firstFrame && top.pos + px > 0) px = top.pos < 0 ? -top.pos : 0;
            }
            if (px < 0) {
                let bottom = null;
                for (let i = frameList.length - 1; i >= 0; i--) {
                    if (!frameList[i].pendingLoad) { bottom = frameList[i]; break; }
                }
                if (bottom && !bottom.lastFrame) {
                    let edge = bottom.pos + direction.GetParallelLength(bottom);
                    if (edge + px < direction.GetWindowLength()) {
                        px = direction.GetWindowLength() - edge;
                        if (px > 0) px = 0;
                    }
                }
            }
            currentFrame = frameList[0];
            let lastPos = px + frameList[0].pos;
            for (let i = 0; i < frameList.length; i++) {
                let e = frameList[i];
                e.pos = lastPos;
                direction.SetPosStyle(e);
                if (e.pos <= 0 && e.pos + direction.GetParallelLength(e) > 0) { currentFrame = e; }
                lastPos = e.pos + direction.GetParallelLength(e);
                if (i + 1 < frameList.length && e.spread.indexOf("page-spread-left") >= 0) lastPos += spreadGap;
                else if (e.imagePage && i + 1 < frameList.length && frameList[i + 1].imagePage) lastPos -= 1;
            }
            if (!LoadingBusy()) CheckLoad();
            SetScrollBar();
            MeasureScroll(px);
        }
        var longScrollTimerHandle = null;
        var longScrollRest = 0;
        var longScrollDelta = 40;
        function LongScroll(px) {
            if (longScrollTimerHandle != null) { return; }
            longScrollRest = px;
            longScrollDelta = Math.abs(px) / 15;
            longScrollTimerHandle = setInterval(function () {
                if (longScrollRest > 0) {
                    Scroll(longScrollDelta);
                    longScrollRest -= longScrollDelta;
                    if (longScrollRest <= 0) { clearInterval(longScrollTimerHandle); longScrollTimerHandle = null; longScrollRest = 0 }
                }
                else if (longScrollRest < 0) {
                    Scroll(-longScrollDelta);
                    longScrollRest += longScrollDelta;
                    if (longScrollRest >= 0) { clearInterval(longScrollTimerHandle); longScrollTimerHandle = null; longScrollRest = 0 }
                }

            }, 25);
        }
        var loading = 0;
        var offScreenDestoryDistance = 500;
        var preLoadDistance = 500;
        var checking = false;
        function CheckLoad() {
            if (paged) {
                CheckLoadPaged();
                return;
            }
            if (checking) return;
            checking = true;
            CheckForward();
            CheckBackward();
            checking = false;
        }
        function CheckBackward() {
            let first = frameList[0];
            if (-first.pos < preLoadDistance) {
                if (!first.firstFrame) {
                    frameList.unshift(CreateFrame(first.urlIndex - 1, first.pos, CheckBackward, true));
                }
            }

            if (!first.pendingLoad && first.pos + direction.GetParallelLength(first) < -offScreenDestoryDistance) {
                DropFrame(first);
                let idx = frameList.indexOf(first);
                if (idx >= 0) frameList.splice(idx, 1);
            }
        }
        function CheckForward() {
            let last = frameList[frameList.length - 1];
            if (last.pos + direction.GetParallelLength(last) < direction.GetWindowLength() + preLoadDistance) {

                if (!last.lastFrame) {
                    frameList.push(CreateFrame(last.urlIndex + 1, last.pos + direction.GetParallelLength(last), CheckForward));
                }
            }

            if (!last.pendingLoad && last.pos > direction.GetWindowLength() + offScreenDestoryDistance) {
                DropFrame(last);
                let idx = frameList.indexOf(last);
                if (idx >= 0) frameList.splice(idx, 1);
                CheckLoad();
            }
        }


        function GetCurrentChapterStartIndex() {
            let i = currentFrame.urlIndex;
            do {
                if (contentChapterData[i] != "") break;
                i--;
            } while (i >= 0);
            return i;
        }
        function GetPreviousChapterStartIndex() {
            if (!currentFrame || !contentChapterData || !contentChapterData.length) return 0;
            let i = currentFrame.urlIndex;
            if (i >= contentChapterData.length) i = contentChapterData.length - 1;
            if (i < 0) return 0;
            if (contentChapterData[i] != "") i--;
            else {
                while (i > 0 && contentChapterData[i] == "") i--;
                i--;
            }
            while (i > 0 && contentChapterData[i] == "") i--;
            return i < 0 ? 0 : i;
        }
        function GetNextChapterStartIndex() {
            let last = contentChapterData.length - 1;
            if (!currentFrame || currentFrame.urlIndex >= last) return Math.max(0, last);
            let i = currentFrame.urlIndex + 1;
            while (i < last) {
                if (contentChapterData[i] != "") break;
                i++;
            }
            return i;
        }

    </script>

</body>
